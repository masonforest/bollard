<!doctype html>
<html lang="en">
<head>

<title>Bollard</title>
<meta name="description" content="Send, receive and swap across chains. Instant, free, backed one for one by coins burned on their chains, and finalized on Bitcoin.">
<script type="importmap">
{ "imports": {
  "flatbuffers": "https://unpkg.com/flatbuffers@25.2.10/mjs/flatbuffers.js",
  "@noble/secp256k1": "https://unpkg.com/@noble/secp256k1@2.2.3/index.js"
} }
</script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root { --fg: #111; --bg: #fff; --muted: #888; --line: #e4e4e4; --accent: #1f5fbf; --on-accent: #fff; --ok: #16a34a; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --muted: #777; --line: #2a2a2a; --accent: #6ea0ff; --on-accent: #06152b; --ok: #22c55e; } }
* { box-sizing: border-box; }
.hidden { display: none !important; }
.coin { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; flex: none; position: relative; }
.coin.lg { width: 40px; height: 40px; font-size: 17px; }
.coin .net { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bg); font-size: 8px; display: inline-flex; align-items: center; justify-content: center; }
.coin.lg .net { width: 18px; height: 18px; font-size: 10px; }
.c-btc { background: #f7931a; } .c-eth { background: #627eea; } .c-blrd { background: #1f5fbf; } .c-usdc { background: #2775ca; } .c-usdt { background: #26a17b; }
.pill .coin { width: 22px; height: 22px; font-size: 11px; margin: -2px 6px -2px -4px; vertical-align: middle; }
.pill .coin .net { width: 11px; height: 11px; font-size: 6px; right: -2px; bottom: -2px; }
li .coin, nav .coin { width: 22px; height: 22px; font-size: 11px; margin-right: 8px; vertical-align: middle; }
li .coin .net, nav .coin .net { width: 11px; height: 11px; font-size: 6px; right: -2px; bottom: -2px; }
.withicon { display: inline-flex; align-items: center; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 400px; margin: 0 auto; padding: 40px 24px calc(48px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 28px; }
h1 { text-align: center; font-size: 54px; font-weight: 500; letter-spacing: -0.03em; margin: 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
h2 { font-size: 22px; font-weight: 500; margin: 0; text-align: center; }
p { margin: 0; }
.center { text-align: center; }
.muted { color: var(--muted); font-size: 15px; }
.muted a { color: inherit; }
.row { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.row.center { justify-content: center; }
.row.between { justify-content: space-between; }
.row.fill { flex-wrap: nowrap; gap: 8px; }
.row.end { justify-content: flex-end; gap: 8px; }
.row.fill button { flex: 1; padding: 8px 12px; font-size: 15px; white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.center { align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 13px; color: var(--muted); }
button, .button { font: inherit; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 999px; padding: 10px 20px; cursor: pointer; text-decoration: none; display: inline-block; }
button.primary { background: var(--accent); color: var(--on-accent); }
button.link { border: 0; padding: 0; color: var(--muted); }
button:disabled { opacity: 0.4; cursor: default; }
input, select { font: inherit; color: var(--fg); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; width: 100%; outline: none; border-radius: 0; }
input:focus, select:focus { border-color: var(--accent); }
input.amount { font-size: 40px; font-weight: 500; letter-spacing: -0.02em; }
.error { color: #c33; font-size: 15px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
li .sub { display: block; color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
.qr svg { display: block; width: 180px; border-radius: 8px; background: #fff; }
.big-amount { display: flex; align-items: center; }
.big-amount .grow { flex: 1; display: flex; justify-content: flex-end; }
.big-amount .entry { display: inline-flex; align-items: baseline; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
.big-amount .prefix { color: var(--line); margin-right: 2px; }
.big-amount .suffix { font-size: 28px; color: var(--muted); margin-left: 8px; }
.big-amount input { font: inherit; font-size: inherit; font-weight: inherit; letter-spacing: inherit; color: var(--fg); border: 0; padding: 0; min-width: 1ch; text-align: left; caret-color: #7b4fd1; }
.big-amount input::placeholder { color: var(--fg); opacity: .6; }
.swap-unit { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--line); color: var(--fg); font-size: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.qr.big svg { width: min(320px, 100%); }
.ok { color: var(--ok); }
main.full { max-width: none; padding: 0; }
.overlay { position: fixed; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; cursor: pointer; }
iframe.trade { display: block; width: 100%; height: calc(100dvh - 52px - env(safe-area-inset-top)); border: 0; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
nav { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 2px; padding: 0 16px; padding-top: env(safe-area-inset-top); }
nav .brand { font-weight: 600; margin-right: 12px; white-space: nowrap; }
nav .items { display: flex; gap: 2px; }
nav .items button { border: 0; border-radius: 0; padding: 14px 10px; color: var(--muted); font-size: 14px; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav .items button.active { color: var(--fg); border-bottom-color: var(--accent); }
nav .bal { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
nav .menu-btn { display: none; margin-left: 8px; border: 0; padding: 12px 4px 12px 12px; color: var(--fg); font-size: 22px; line-height: 1; }
@media (max-width: 560px) {
  nav { position: sticky; }
  nav .menu-btn { display: block; }
  nav .items { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  nav .items.open { display: flex; }
  nav .items button { text-align: left; padding: 14px 20px; font-size: 16px; border-bottom: 0; border-left: 3px solid transparent; margin: 0; }
  nav .items button.active { border-left-color: var(--accent); }
  main { padding: 28px 20px calc(40px + env(safe-area-inset-bottom)); gap: 24px; }
  h1 { font-size: 44px; }
}
button, input, select { touch-action: manipulation; }
input.mono { font-size: 16px; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.gate { min-height: calc(100dvh - 120px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.gate button { width: min(300px, 100%); text-align: center; }
.success { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0; }
.success .ring { fill: var(--ok); transform-origin: 60px 60px; animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
.success .tick { fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw .5s .35s ease-out forwards; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.assets li { border-top: 1px solid var(--line); }
</style>
</head>
<body>
<nav hidden></nav>
<main></main>
<script type="module">
import { TxType, hex, signers, submit, createPasskey, signInPasskey, randomSecret, pubkeyOf } from '/dashboard/wire.js';

// ----- node -----
const BASE_DOMAIN = location.hostname.replace(/^(app|www)\./, '');
let api = (location.port || location.hostname.startsWith('mainnet.') || location.hostname === 'localhost') ? '' : 'https://mainnet.' + BASE_DOMAIN;
const j = async (path, body) => {
  const res = await fetch(api + path, body && { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `${path} failed`);
  return data;
};
const stored = (k) => JSON.parse(localStorage.getItem(k) || 'null');
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));

// ----- units -----
const assets = {};
const NAMES = { 'btc:BTC': 'Bitcoin', 'eth:ETH': 'Ether', 'eth:USDC': 'US Dollar', 'eth:USDT': 'Tether', 'BLRD': 'Bollard' };
const SYMBOL = { 'eth:USDC': '$', 'eth:USDT': '₮', 'btc:BTC': '₿', 'eth:ETH': 'Ξ', 'BLRD': 'ʙ' };
const CHAIN = { btc: 'Bitcoin', eth: 'Ethereum', blrd: 'Bollard' };
function toAtoms(human, id) {
  const a = assets[id]; const s = String(human).trim();
  if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') throw new Error('Enter an amount.');
  const [i, f = ''] = s.split('.');
  if (f.length > a.decimals) throw new Error(`At most ${a.decimals} decimals for ${a.symbol}.`);
  return BigInt(i || '0') * 10n ** BigInt(a.decimals) + BigInt((f + '0'.repeat(a.decimals)).slice(0, a.decimals) || '0');
}
function human(atoms, id, digits) {
  const a = assets[id]; if (!a) return String(atoms);
  const s = BigInt(atoms).toString().padStart(a.decimals + 1, '0');
  let t = s.slice(0, -a.decimals) + '.' + s.slice(-a.decimals);
  if (digits !== undefined) t = Number(t).toFixed(digits); else t = t.replace(/\.?0+$/, '');
  return t;
}
const money = (atoms, id) => (id === 'eth:USDC' || id === 'eth:USDT') ? `${SYMBOL[id]}${Number(human(atoms, id, 2)).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : `${human(atoms, id)} ${assets[id]?.symbol || id}`;
const coinIcon = (id) => { const a = assets[id]; if (!a) return ''; const cls = 'c-' + (a.symbol === 'USDC' || a.symbol === 'USDT' ? a.symbol.toLowerCase() : a.chain); const net = a.chain === 'blrd' ? '' : `<span class="net c-${a.chain}">${a.chain === 'btc' ? '₿' : 'Ξ'}</span>`; return `<span class="coin ${cls}">${a.symbol[0]}${net}</span>`; };
const short = (h, n = 10) => (h ? h.slice(0, n) + '…' : '');

// ----- state -----
const state = { flight: stored('bollard.flight'), qr: null, key: stored('bollard.passkey'), view: 'home', info: null, busy: false, error: '', activity: null, deposit: null, success: null, book: null };
const me = () => state.key?.pubkey;
const signer = () => signers.passkey(state.key);
const currency = () => state.info?.preferred || 'eth:USDC';
const main = document.querySelector('main');
const nav = document.querySelector('nav');

async function refresh() {
  if (!state.key) return render();
  state.info = await j(`/balances/${me()}`);
  await checkFlight();
  render();
}
// A link that is out: once whoever opened it has accepted, the throwaway account is empty and the send is done.
async function checkFlight() {
  const f = state.flight; if (!f) return;
  try {
    const b = await j(`/balances/${hex.enc(pubkeyOf(f.secret))}`);
    const left = (b.assets || []).some((x) => x.amount > 0) || b.blrd > 0;
    if (!left) endFlight(`Sent ${f.amount}`);
  } catch {}
}
function endFlight(success) { state.flight = null; localStorage.removeItem('bollard.flight'); if (state.qr) state.qr = null; if (success) state.success = success; }
async function shareLink(link) {
  if (navigator.share) { try { await navigator.share({ url: link }); return; } catch {} }
  try { await navigator.clipboard.writeText(link); state.success = 'Link copied'; } catch {}
}
async function run(fn) {
  state.busy = true; state.error = ''; render();
  try { await fn(); } catch (e) { state.error = e.message || String(e); }
  state.busy = false; render();
}
async function tx(type, body) { return submit(api, signer(), type, body); }

// ----- actions -----
const actions = {
  create: () => run(async () => {
    const key = await createPasskey('Bollard');
    await j('/keys', { cred_id: key.id, pubkey: key.pubkey });
    store('bollard.passkey', key); state.key = key;
    await refresh();
  }),
  signin: () => run(async () => {
    const id = await signInPasskey(stored('bollard.passkey')?.id);
    const key = stored('bollard.passkey')?.id === id ? stored('bollard.passkey') : { id, pubkey: (await j(`/keys/${id}`)).pubkey };
    store('bollard.passkey', key); state.key = key;
    await refresh();
  }),
  signout: () => { localStorage.removeItem('bollard.passkey'); state.key = null; state.info = null; render(); },
  menu: () => { state.menu = !state.menu; render(); },
  advanced: (el) => { try { localStorage.setItem('bollard.advanced', el.dataset.value); } catch {} render(); },
  share: (el) => shareLink(el.dataset.link),
  qr: (el) => { state.qr = el.dataset.link; render(); },
  closeqr: () => { state.qr = null; render(); },
  cancelFlight: () => run(async () => {
    const f = state.flight; const pk = hex.enc(pubkeyOf(f.secret));
    const b = await j(`/balances/${pk}`);
    for (const x of [...(b.assets || []), ...(b.blrd > 0 ? [{ asset: 'BLRD', amount: b.blrd }] : [])].filter((x) => x.amount > 0)) {
      await submit(api, signers.secret(f.secret), TxType.Send, { to: hex.dec(me()), asset: x.asset, amount: BigInt(x.amount) });
    }
    endFlight(null);
    await refresh();
  }),
  depositAsset: (el) => { state.deposit = { asset: el.dataset.value, unit: el.dataset.value === 'btc:BTC' ? 'usd' : 'native' }; render(); if (el.dataset.value === 'btc:BTC') btcPrice().then((p) => { state.btcPrice = p; render(); }); },
  depositUnit: (el) => { state.deposit.unit = el.dataset.value; render(); },
  payMetaMask: (el) => run(async () => {
    const txid = await payWithEthWallet(state.deposit.asset, el.dataset.to, el.dataset.amount);
    (state.deposit.sent ||= {})[el.dataset.to] = txid;
  }),
  depositDone: () => { clearInterval(state.depositTimer); state.deposit = null; render(); },
  cancelWithdraw: (el) => run(async () => { await tx(TxType.CancelOrder, { order_id: hex.dec(el.dataset.value) }); await loadWithdrawals(); await refresh(); }),
  dismissAccept: () => { state.accept = null; history.replaceState(null, '', location.pathname); render(); },
  accept: () => run(async () => {
    const a = state.accept; const signer = signers.secret(a.secret);
    let got = [];
    for (const x of a.assets.filter((x) => x.amount > 0)) {
      await submit(api, signer, TxType.Send, { to: hex.dec(me()), asset: x.asset, amount: BigInt(x.amount) });
      got.push(money(x.amount, x.asset));
    }
    state.accept = null; history.replaceState(null, '', location.pathname);
    state.success = `Accepted ${got.join(' + ')}`; state.view = 'home';
    await refresh();
  }),
  tab: (el) => { state.view = el.dataset.value; state.menu = false; if (el.dataset.value !== 'deposit' && state.deposit && !state.deposit.watching) state.deposit = null; state.error = ''; state.success = null; state.qr = null; if (state.view === 'activity') loadActivity(); if (state.view === 'withdraw') loadWithdrawals(); render(); },
  copy: async (el) => { try { await navigator.clipboard.writeText(el.dataset.text); } catch {} el.textContent = 'Copied'; setTimeout(() => (el.textContent = el.dataset.label || 'Copy'), 1500); },
  currency: (el) => run(async () => { await tx(TxType.SetCurrency, { asset: el.dataset.value }); await refresh(); }),
};
const forms = {
  // Magic link, as on bitcoin.dance: fund a throwaway key and share a link that carries it. Whoever opens the link accepts the money.
  send: (form, via) => run(async () => {
    state.via = via;
    const asset = sendFrom().asset;
    const amount = toAtoms(form.amount.value, asset);
    if (amount <= 0n) throw new Error('Enter an amount.');
    const secret = randomSecret();
    await tx(TxType.Send, { to: pubkeyOf(secret), asset, amount });
    const link = `${location.origin}/#magic/${secret}`;
    state.flight = { secret, link, asset, amount: money(amount, asset) }; store('bollard.flight', state.flight);
    if (via === 'qr') state.qr = link;
    else await shareLink(link);
    await refresh();
  }),
  // Deposit: take whoever is leaving first (pay them on chain, one for one), and burn only what nobody is selling.
  deposit: (form) => run(async () => {
    const d = state.deposit; const asset = d.asset; const a = assets[asset];
    let left;
    if (asset === 'btc:BTC' && d.unit === 'usd') {
      if (!state.btcPrice) throw new Error('No bitcoin price on the book yet; switch to BTC.');
      const usd = toAtoms(form.amount.value, 'eth:USDC');
      left = (usd * 100000000n) / BigInt(Math.round(state.btcPrice));
    } else left = toAtoms(form.amount.value, asset);
    if (left <= 0n) throw new Error('Enter an amount.');
    const exits = ((await j(`/book?market=${encodeURIComponent(asset + '/' + asset)}`)).deposits || []).filter((o) => o.account !== me());
    const pays = [];
    for (const o of exits) {
      if (left <= 0n) break;
      const take = left < BigInt(o.qty_left) ? left : BigInt(o.qty_left);
      if (take < BigInt(a.min_quantity)) break;
      const out = await tx(TxType.Claim, { order_id: hex.dec(o.id), quantity: take, receive_address: '' });
      const m = (await j(`/matches?account=${me()}&kind=deposit&limit=5`)).find((x) => x.id === out.hash);
      if (m) { pays.push(m); left -= take; }
    }
    d.pays = pays; d.burn = left > 0n ? { address: (await j(`/account/${me()}`)).burn[a.chain], amount: left } : null;
    d.before = balanceOf(asset); d.watching = true; render(); watchDeposit();
    if (a.chain === 'eth' && hasEthWallet()) {
      for (const m of pays) { try { (d.sent ||= {})[m.taker_pay_to] = await payWithEthWallet(asset, m.taker_pay_to, m.taker_amount); render(); } catch (e) { state.error = e.message; render(); break; } }
      if (d.burn && !state.error) { try { (d.sent ||= {})[d.burn.address] = await payWithEthWallet(asset, d.burn.address, d.burn.amount); render(); } catch (e) { state.error = e.message; render(); } }
    }
  }),
  withdraw: (form) => run(async () => {
    const asset = form.asset.value; const amount = toAtoms(form.amount.value, asset);
    const address = form.to.value.trim();
    if (!address) throw new Error('Enter the address to be paid at.');
    const st = await j('/status');
    await tx(TxType.PlaceOrder, { market: `${asset}/${asset}`, side: 1, quantity: amount, price: 100000000n, bond: 0n, claim_bond: 0n, fill_policy: 1, receive_address: address, expiry_height: (st.bitcoin?.height || 0) + 1000, settle: 1 });
    state.success = `Withdrawing ${money(amount, asset)}: a buyer pays ${short(address, 12)} on chain and takes your balance.`; state.view = 'home';
    await refresh();
  }),
};

// Dollars per bitcoin from the book: the middle of the best bid and ask, else the last trade. Quote atoms per 10^8 sats.
async function btcPrice() {
  try {
    const b = await j('/book?market=btc:BTC/eth:USDC');
    const ask = b.asks?.length ? Math.min(...b.asks.map((o) => Number(o.price))) : null;
    const bid = b.bids?.length ? Math.max(...b.bids.map((o) => Number(o.price))) : null;
    if (ask && bid) return (ask + bid) / 2; if (ask || bid) return ask || bid;
    const t = await j('/trades?market=btc:BTC/eth:USDC&limit=1'); if (t?.length) return Number(t[0].price);
  } catch {}
  return null;
}
// Pay an Ethereum amount from the browser wallet when one is injected (MetaMask and friends).
const hasEthWallet = () => typeof window.ethereum !== 'undefined';
async function payWithEthWallet(asset, to, atoms) {
  const a = assets[asset]; const eth = window.ethereum;
  const [from] = await eth.request({ method: 'eth_requestAccounts' });
  try { await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x1' }] }); } catch (e) { if (e.code !== 4001) throw new Error('Switch MetaMask to Ethereum mainnet.'); else throw e; }
  const raw = BigInt(atoms) * BigInt(a.atom_scale || 1);
  const pad = (h) => h.replace(/^0x/, '').padStart(64, '0');
  const tx = a.contract
    ? { from, to: a.contract, data: '0xa9059cbb' + pad(to) + pad(raw.toString(16)) }
    : { from, to, value: '0x' + raw.toString(16) };
  return eth.request({ method: 'eth_sendTransaction', params: [tx] });
}
async function watchDeposit() {
  clearInterval(state.depositTimer);
  state.depositTimer = setInterval(async () => {
    const d = state.deposit; if (!d || !d.watching) return clearInterval(state.depositTimer);
    try {
      for (const m of d.pays.filter((m) => m.status === 'open')) {
        const r = await j(`/find-payment?match=${m.id}&leg=0`);
        if (r.txid && !r.reported) await tx(TxType.ReportPayment, { match_id: hex.dec(m.id), leg: 0, txid: r.txid });
      }
      if (d.pays.length) { const ms = await j(`/matches?account=${me()}&kind=deposit&limit=20`); d.pays = d.pays.map((m) => ms.find((x) => x.id === m.id) || m); }
      await refresh();
      const got = balanceOf(d.asset) - d.before;
      const paysDone = d.pays.every((m) => m.status !== 'open');
      const burnDone = !d.burn || got >= (d.pays.filter((m) => m.status === 'closed').reduce((n, m) => n + BigInt(m.maker_amount), 0n) + d.burn.amount);
      if (paysDone && burnDone) { d.watching = false; clearInterval(state.depositTimer); state.success = `Deposited ${money(got, d.asset)}`; state.deposit = null; state.view = 'home'; render(); }
      else render();
    } catch {}
  }, 10000);
}
async function loadWithdrawals() { if (me()) { state.withdrawals = (await j(`/orders?account=${me()}&status=open&limit=50`)).filter((o) => o.settle === 1); render(); } }
async function loadActivity() { if (me()) { state.activity = await j(`/activity/${me()}`); render(); } }

// ----- views -----
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qrSvg = (text) => { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2 }); } catch { return ''; } };
// Everything the account holds, the chosen currency first, BLRD last.
function holdings() {
  const c = currency();
  const rows = (state.info?.assets || []).filter((a) => a.amount > 0).map((a) => ({ asset: a.asset, amount: BigInt(a.amount) }));
  if (BigInt(state.info?.blrd || 0) > 0n) rows.push({ asset: 'BLRD', amount: BigInt(state.info.blrd) });
  return rows.sort((x, y) => (x.asset === c ? -1 : y.asset === c ? 1 : 0));
}
// What a magic link is funded from: the chosen currency, or, when that is empty, the network and token the user picked.
function sendFrom() {
  const c = currency();
  if (balanceOf(c) > 0n) return { chain: assets[c]?.chain, asset: c };
  const held = holdings(); if (!held.length) return { chain: assets[c]?.chain, asset: c };
  const chain = state.from?.chain && held.some((h) => assets[h.asset]?.chain === state.from.chain) ? state.from.chain : assets[held[0].asset]?.chain;
  const onChain = held.filter((h) => assets[h.asset]?.chain === chain);
  const asset = state.from?.asset && onChain.some((h) => h.asset === state.from.asset) ? state.from.asset : onChain[0].asset;
  return { chain, asset };
}
const advanced = () => { try { return localStorage.getItem('bollard.advanced') === '1'; } catch { return false; } };
const balanceOf = (id) => (id === 'BLRD' ? BigInt(state.info?.blrd || 0) : BigInt(state.info?.assets?.find((a) => a.asset === id)?.amount || 0));

function render() {
  nav.hidden = !state.key;
  if (!state.key) {
    main.innerHTML = `
      <div class="gate">
        <h2 style="margin-bottom:18px">Welcome to Bollard Exchange</h2>
        <button class="primary" data-action="create">Create account</button>
        <button data-action="signin">Sign in</button>
        ${state.error ? `<p class="error">${esc(state.error)}</p>` : ''}
      </div>`;
    return;
  }
  const v = state.accept ? acceptView : (views[state.view] || views.home);
  main.classList.toggle('full', state.view === 'trade' && !state.accept);
  // Refreshes must not rebuild the Trade frame, or whatever is typed in it is lost.
  if (state.view === 'trade' && !state.accept && !state.busy && !state.error && main.querySelector('iframe.trade')) return;
  // Background refreshes re-render; keep whatever the user has typed, and where the caret was.
  const typed = [...main.querySelectorAll('input[name], select[name]')].map((el) => ({ name: el.name, value: el.value, focused: document.activeElement === el, pos: el.selectionStart }));
  main.innerHTML = (state.busy ? '<p class="center muted"><span class="spinner"></span>Working…</p>' : '') + v() + (state.error ? `<p class="error center">${esc(state.error)}</p>` : '') + (state.qr ? `<div class="overlay" data-action="closeqr"><div class="qr big">${qrSvg(state.qr)}</div><p class="muted">Tap to close</p></div>` : '');
  for (const t of typed) {
    const el = main.querySelector(`[name="${t.name}"]`); if (!el || el.type === 'hidden' || !t.value) continue;
    el.value = t.value; el.dispatchEvent(new Event('input', { bubbles: true }));
    if (t.focused) { el.focus(); try { el.setSelectionRange(t.pos, t.pos); } catch {} }
  }
  nav.innerHTML = `<span class="brand">Bollard</span><div class="items${state.menu ? ' open' : ''}">` + [['home', 'Home'], ['trade', 'Trade'], ['deposit', 'Deposit'], ['withdraw', 'Withdraw'], ['activity', 'History'], ['settings', 'Settings']].map(([t, label]) => `<button data-action="tab" data-value="${t}" class="${state.view === t ? 'active' : ''}">${label}</button>`).join('') + `</div><span class="bal withicon">${coinIcon('btc:BTC')}${money(balanceOf('btc:BTC'), 'btc:BTC')}<span style="width:14px"></span>${coinIcon('eth:USDC')}${money(balanceOf('eth:USDC'), 'eth:USDC')}</span><button class="menu-btn" data-action="menu" aria-label="Menu">${state.menu ? '✕' : '☰'}</button>`;
}
// Opening a magic link: show what it carries and let the viewer accept it into their own account.
function acceptView() {
  const a = state.accept;
  if (a.error) return `<h2>Sending…</h2><p class="error center">${esc(a.error)}</p>`;
  if (!a.assets) return `<h2>Sending…</h2><p class="center muted"><span class="spinner"></span>Looking up the link…</p>`;
  const total = a.assets.filter((x) => x.amount > 0);
  if (!total.length) return `<h2>Sending…</h2><p class="center muted">This link has already been accepted.</p><button class="link" data-action="dismissAccept">Back</button>`;
  return `<h2>Sending…</h2><div class="stack center">
    <button class="primary" data-action="accept" style="font-size:20px;padding:16px 28px" ${state.busy ? 'disabled' : ''}>Accept ${total.map((x) => money(x.amount, x.asset)).join(' + ')}</button>
    <p class="muted center">It lands in your account as ${NAMES[currency()] || currency()}.</p>
    <button class="link" data-action="dismissAccept">Not now</button></div>`;
}
const views = {
  home: () => {
    const c = currency();
    const held = holdings();
    const empty = balanceOf(c) === 0n && held.length > 0;
    const from = sendFrom();
    const chains = [...new Set(held.map((h) => assets[h.asset]?.chain))];
    const tokens = held.filter((h) => assets[h.asset]?.chain === from.chain);
    const others = held.filter((h) => h.asset !== c);
    const f = state.flight;
    const busy = state.busy ? 'disabled' : '';
    const body = f ? `
      <div class="stack">
        <p class="muted center"><span class="spinner"></span>${state.busy ? 'Cancelling' : 'Sending'} ${esc(f.amount)}</p>
        <div class="row fill"><button data-action="cancelFlight" ${busy}>Cancel</button><button data-action="qr" data-link="${esc(f.link)}">QR code</button><button class="primary" data-action="share" data-link="${esc(f.link)}">${navigator.share ? 'Share link' : 'Copy link'}</button></div>
      </div>` : `
      <form data-form="send" class="stack">
        ${empty ? `
        <div class="row fill">
          <div class="field" style="flex:1"><span class="label">Network</span><select name="chain" data-change="fromChain">${chains.map((ch) => `<option value="${ch}" ${ch === from.chain ? 'selected' : ''}>${CHAIN[ch] || ch}</option>`).join('')}</select></div>
          <div class="field" style="flex:1"><span class="label">Token</span><select name="asset" data-change="fromAsset">${tokens.map((h) => `<option value="${h.asset}" ${h.asset === from.asset ? 'selected' : ''}>${assets[h.asset]?.symbol || h.asset} · ${money(h.amount, h.asset)}</option>`).join('')}</select></div>
        </div>` : ''}
        <input class="amount" name="amount" placeholder="${empty ? '0 ' + (assets[from.asset]?.symbol || '') : '0.00'}" inputmode="decimal" autocomplete="off" required>
        <div class="row end">
          <button name="via" value="qr" ${busy}>${state.busy && state.via === 'qr' ? 'Signing…' : 'Generate QR code'}</button>
          <button class="primary" name="via" value="share" ${busy}>${state.busy && state.via === 'share' ? 'Signing…' : 'Send'}</button>
        </div>
      </form>`;
    return `
      ${state.success ? `<div class="success"><svg viewBox="0 0 120 120" width="96" height="96"><circle class="ring" cx="60" cy="60" r="56"/><path class="tick" d="M34 62 L53 80 L88 42"/></svg><p>${esc(state.success)}</p></div>` : ''}
      <div class="stack center"><h1>${money(balanceOf(c), c)}</h1></div>
      ${body}
      ${others.length ? `<ul class="assets">${others.map((h) => `<li><span class="withicon">${coinIcon(h.asset)}${NAMES[h.asset] || h.asset}</span><span>${money(h.amount, h.asset)}</span></li>`).join('')}</ul>` : ''}`;
  },
  trade: () => `<iframe class="trade" src="/dashboard/" title="Trade"></iframe>`,
  deposit: () => {
    const d = state.deposit || (state.deposit = { asset: 'eth:USDC', unit: 'native' });
    const a = assets[d.asset]; const chain = CHAIN[a?.chain] || '';
    if (d.pays || d.burn) {
      return `
        <h2>Deposit ${a?.symbol}</h2>
        <div class="stack">
          ${(d.pays || []).map((m) => `<div class="stack center" style="padding:12px 0;border-top:1px solid var(--line)">
            <p>Pay <b>${money(m.taker_amount, m.taker_asset)}</b> on ${chain} to</p>
            <div class="qr">${qrSvg(a.chain === 'btc' ? `bitcoin:${m.taker_pay_to}?amount=${human(m.taker_amount, m.taker_asset)}` : m.taker_pay_to)}</div>
            <p class="mono">${m.taker_pay_to}</p>
            <div class="row center"><button data-action="copy" data-text="${m.taker_pay_to}" data-label="Copy address">Copy address</button>${a.chain === 'eth' && hasEthWallet() && m.status === 'open' ? `<button class="primary" data-action="payMetaMask" data-to="${m.taker_pay_to}" data-amount="${m.taker_amount}">Pay with MetaMask</button>` : ''}</div>
            ${d.sent?.[m.taker_pay_to] ? `<p class="muted center">Sent ${short(d.sent[m.taker_pay_to], 14)} from your wallet.</p>` : ''}
            <p class="muted center">${m.status === 'closed' ? 'Paid; the balance is yours.' : m.status !== 'open' ? `This claim ${m.status}; the seller got their balance back.` : m.taker_txid ? `Payment ${short(m.taker_txid, 12)} seen; waiting for a block.` : 'Someone is leaving; you buy their balance by paying them directly. Watching the chain.'}</p>
          </div>`).join('')}
          ${d.burn ? `<div class="stack center" style="padding:12px 0;border-top:1px solid var(--line)">
            <p>Send <b>${money(d.burn.amount, d.asset)}</b> on ${chain} to your own address</p>
            <div class="qr">${qrSvg(a.chain === 'btc' ? `bitcoin:${d.burn.address}?amount=${human(d.burn.amount, d.asset)}` : d.burn.address)}</div>
            <p class="mono">${d.burn.address}</p>
            <div class="row center"><button data-action="copy" data-text="${d.burn.address}" data-label="Copy address">Copy address</button>${a.chain === 'eth' && hasEthWallet() ? `<button class="primary" data-action="payMetaMask" data-to="${d.burn.address}" data-amount="${d.burn.amount}">Pay with MetaMask</button>` : ''}</div>
            ${d.sent?.[d.burn.address] ? `<p class="muted center">Sent ${short(d.sent[d.burn.address], 14)} from your wallet.</p>` : ''}
            <p class="muted center">${d.pays?.length ? 'That is all anyone is selling, so the rest' : 'Nobody is selling ' + (a?.symbol || '') + ', so this'} is minted: what you send here is burned on ${chain} and appears in your balance after ${a.chain === 'btc' ? 'one confirmation' : 'the block is final, about 15 minutes'}.</p>
          </div>` : ''}
          <button class="link" data-action="depositDone">Done</button>
        </div>`;
    }
    return `
      <h2>Deposit</h2>
      <div class="row center">${[['eth:USDC', 'USDC on Ethereum'], ['btc:BTC', 'Bitcoin']].map(([id, label]) => `<button class="pill ${id === d.asset ? 'primary' : ''}" data-action="depositAsset" data-value="${id}">${coinIcon(id)}${label}</button>`).join('')}</div>
      <form data-form="deposit" class="stack">
        ${d.asset === 'btc:BTC' ? `
        <div class="big-amount">
          <span class="grow"></span>
          <span class="entry"><span class="prefix ${d.unit === 'usd' ? '' : 'hidden'}">$</span><input name="amount" inputmode="decimal" placeholder="0" autocomplete="off" required data-input="depositAmount" style="width:1ch"><span class="suffix ${d.unit === 'btc' ? '' : 'hidden'}">BTC</span></span>
          <span class="grow"><button type="button" class="swap-unit" data-action="depositUnit" data-value="${d.unit === 'usd' ? 'btc' : 'usd'}" aria-label="Switch between dollars and bitcoin">⇅</button></span>
        </div>
        <p class="muted center" id="dep-equiv">${d.unit === 'usd' ? '0 BTC' : '$0'}</p>` : `
        <div class="field"><input class="amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required></div>`}
        <button class="primary" type="submit" ${state.busy ? 'disabled' : ''}>Deposit</button>
      </form>`;
  },
  withdraw: () => {
    const held = (state.info?.assets || []).filter((x) => x.amount > 0);
    const open = (state.withdrawals || []);
    return `
      <h2>Withdraw</h2>
      ${open.length ? `<ul>${open.map((o) => `<li><span>${money(o.qty_left, o.base)} to ${short(o.recv_addr, 12)}<span class="sub">waiting for a buyer to pay you on chain</span></span><button class="link" data-action="cancelWithdraw" data-value="${o.id}">Cancel</button></li>`).join('')}</ul>` : ''}
      ${held.length ? `
      <form data-form="withdraw" class="stack">
        <div class="field"><span class="label">Currency</span><select name="asset">${held.map((x) => `<option value="${x.asset}">${NAMES[x.asset] || x.asset} · ${money(x.amount, x.asset)}</option>`).join('')}</select></div>
        <div class="field"><input class="amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required></div>
        <div class="field"><span class="label">Paid to (your address on that chain)</span><input name="to" class="mono" autocomplete="off" spellcheck="false" required></div>
        <p class="muted">Coins on Bollard were burned to get here, so leaving means selling to someone coming in. Your balance is offered one for one; whoever takes it pays your address on chain, and the ledger hands them your balance once the payment is in a block. You can cancel until then.</p>
        <button class="primary" type="submit" ${state.busy ? 'disabled' : ''}>Withdraw</button>
      </form>` : '<p class="muted center">Nothing to withdraw yet.</p>'}`;
  },
  activity: () => {
    const act = state.activity; if (!act) return '<h2>History</h2><p class="muted center"><span class="spinner"></span>Loading…</p>';
    const rows = [];
    for (const t of act.transfers) {
      const out = t.sender === me();
      rows.push({ seq: t.seq, ts: t.ts, label: out ? 'Sent' : 'Received', value: out ? `−${money(t.amount, t.asset)}` : `+${money(t.delivered, t.delivered_asset)}`, sub: out && t.delivered_asset !== t.asset ? `arrived as ${money(t.delivered, t.delivered_asset)}` : short(out ? t.receiver : t.sender, 12) });
    }
    const sendSeqs = new Set(act.transfers.map((t) => t.seq));
    for (const b of act.burns || []) rows.push({ seq: b.seq, ts: b.ts, label: 'Deposited', value: `+${money(b.amount, b.asset)}`, sub: `burned on ${CHAIN[assets[b.asset]?.chain] || ''} · ${short(b.txid, 12)}` });
    for (const m of act.matches) {
      if (m.kind === 'trade' && sendSeqs.has(m.seq)) continue; // the conversion inside a send is shown on the send itself
      if (m.kind === 'deposit' && m.maker === me()) rows.push({ seq: m.seq, ts: m.claimed_ts, label: 'Withdrawal', value: `−${money(m.maker_amount, m.maker_asset)}`, sub: m.status === 'closed' ? `paid to ${short(m.taker_pay_to, 12)}` : m.status === 'open' ? (m.taker_txid ? 'buyer paid, waiting for a block' : 'a buyer took it, waiting for their payment') : `${m.status}; the balance is yours again` });
      else if (m.kind === 'deposit' && m.taker === me()) rows.push({ seq: m.seq, ts: m.claimed_ts, label: 'Bought on chain', value: `+${money(m.maker_amount, m.maker_asset)}`, sub: m.status === 'closed' ? 'done' : m.status === 'open' ? (m.taker_txid ? 'payment seen, waiting for a block' : 'waiting for your payment') : m.status });
      else if (m.kind === 'trade' && m.taker === me()) rows.push({ seq: m.seq, ts: m.claimed_ts, label: 'Swap', value: `${money(m.taker_amount, m.taker_asset)} → ${money(m.maker_amount, m.maker_asset)}`, sub: 'instant' });
    }
    rows.sort((a, b) => b.seq - a.seq);
    return `<h2>History</h2>${rows.length ? `<ul>${rows.map((r) => `<li><span>${r.label}<span class="sub">${esc(r.sub)} · ${new Date(r.ts).toLocaleString()}</span></span><span>${r.value}</span></li>`).join('')}</ul>` : '<p class="muted center">Nothing yet.</p>'}`;
  },
  settings: () => `
    <h2>Settings</h2>
    <div class="stack">
      <span class="label">Your currency</span>
      <div class="row">${Object.values(assets).map((x) => `<button class="pill ${x.id === currency() ? 'primary' : ''}" data-action="currency" data-value="${x.id}">${NAMES[x.id] || x.id}</button>`).join('')}</div>
      <p class="muted">What you see your balance in and what you receive. Anything sent to you in another currency is converted on the way.</p>
      <span class="label">Advanced mode</span>
      <div class="row"><button class="pill ${advanced() ? 'primary' : ''}" data-action="advanced" data-value="1">On</button><button class="pill ${advanced() ? '' : 'primary'}" data-action="advanced" data-value="0">Off</button></div>
      <p class="muted">Trade shows the order book and chart instead of plain Buy and Sell.</p>
      <span class="label">Account</span>
      <p class="mono">${me()}</p>
      <p class="muted">Signed in with a passkey. The same passkey signs you in on your other devices.</p>
      <button data-action="signout">Sign out</button>
    </div>`,
};

// ----- wiring -----
main.addEventListener('click', (e) => { const el = e.target.closest('[data-action]'); const fn = el && actions[el.dataset.action]; if (fn) fn(el); });
nav.addEventListener('click', (e) => { const el = e.target.closest('[data-action]'); const fn = el && actions[el.dataset.action]; if (fn) fn(el); });
main.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (!el) return; if (el.dataset.change === 'fromChain') state.from = { chain: el.value }; if (el.dataset.change === 'fromAsset') state.from = { chain: sendFrom().chain, asset: el.value }; render(); });
main.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input=depositAmount]'); if (!el) return;
  el.style.width = Math.max(1, el.value.length) + 'ch';
  const out = document.getElementById('dep-equiv'); if (!out || state.deposit?.asset !== 'btc:BTC') return;
  const p = state.btcPrice;
  try {
    if (state.deposit.unit === 'usd') { const usd = toAtoms(el.value || '0', 'eth:USDC'); out.textContent = p ? `${human((usd * 100000000n) / BigInt(Math.round(p)), 'btc:BTC')} BTC` : 'no bitcoin price on the book yet'; }
    else { const sats = toAtoms(el.value || '0', 'btc:BTC'); out.textContent = p ? `$${human((sats * BigInt(Math.round(p))) / 100000000n, 'eth:USDC', 2)}` : 'no bitcoin price on the book yet'; }
  } catch { out.textContent = ''; }
});
main.addEventListener('submit', (e) => { e.preventDefault(); const fn = forms[e.target.dataset.form]; if (fn) fn(e.target, e.submitter?.value); });

(async () => {
  if (api) { try { const r = await fetch(api + '/status', { signal: AbortSignal.timeout(4000) }); if (!r.ok) api = ''; } catch { api = ''; } }
  const m = await j('/markets'); for (const a of m.assets) assets[a.id] = a;
  const magic = location.hash.match(/^#magic\/([0-9a-f]{64})$/);
  if (magic) {
    state.accept = { secret: magic[1] };
    render();
    try {
      const b = await j(`/balances/${hex.enc(pubkeyOf(magic[1]))}`);
      state.accept.assets = [...(b.assets || []), ...(b.blrd > 0 ? [{ asset: 'BLRD', amount: b.blrd }] : [])];
    } catch (e) { state.accept.error = e.message; }
  }
  render();
  try { await refresh(); } catch (e) { state.error = e.message; render(); }
  const es = new EventSource(api + '/events');
  es.onmessage = () => { if (state.key) refresh().catch(() => {}); };
  setInterval(() => { if (state.key) refresh().catch(() => {}); }, 20000);
})();
</script>
