<style>

@media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --muted: #777; --line: #2a2a2a; --accent: #6ea0ff; --on-accent: #06152b; --ok: #22c55e; } }

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 560px) {

}

.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.gate { min-height: calc(100dvh - 120px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

.success { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 20px 0; }
.success p { font-size: 20px; }
.success .primary { width: min(240px, 100%); margin-top: 6px; }
#modal .overlay { cursor: default; }
.success .ring { fill: var(--ok); transform-origin: 60px 60px; animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
.success .tick { fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw .5s .35s ease-out forwards; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

</style>

<script type="module">
import { TxType, hex, signers, submit, createPasskey, signInPasskey, randomSecret, pubkeyOf } from '/dashboard/wire.js';

// ----- node -----
const BASE_DOMAIN = location.hostname.replace(/^(app|www)\./, '');
let api = (location.port || location.hostname.startsWith('mainnet.') || location.hostname === 'localhost') ? '' : 'https://mainnet.' + BASE_DOMAIN;
const j = async (path, body) => {
  const res = await fetch(api + path, body && { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `${path} failed`);
  return data;
};
const stored = (k) => JSON.parse(localStorage.getItem(k) || 'null');
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));

// ----- units -----
const assets = {};
const NAMES = { 'btc:BTC': 'Bitcoin', 'eth:ETH': 'Ether', 'eth:USDC': 'US Dollar', 'eth:USDT': 'Tether', 'base:USDC': 'US Dollar on Base', 'base:gtUSDCp': 'USDC Prime', 'BLRD': 'Bollard' };
const VAULT = { asset: 'base:gtUSDCp', address: '0x050cE30b927Da55177A4914EC73480238BAD56f0', chainId: 8453, url: 'https://app.morpho.org/base/vault/0x050cE30b927Da55177A4914EC73480238BAD56f0/gauntlet-usdc-prime' };
async function loadVault() { if (state.vault && Date.now() - state.vaultAt < 60000) return state.vault; state.vaultAt = Date.now(); try { const r = await fetch('https://blue-api.morpho.org/graphql', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query: `{ vaultV2ByAddress(address: "${VAULT.address}", chainId: ${VAULT.chainId}) { netApy apy sharePrice } }` }) }); state.vault = (await r.json()).data?.vaultV2ByAddress || null; } catch { state.vault = null; } render(); return state.vault; }
const SYMBOL = { 'eth:USDC': '$', 'eth:USDT': '₮', 'base:USDC': '$', 'btc:BTC': '₿', 'eth:ETH': 'Ξ', 'BLRD': 'ʙ' };
const CHAIN = { btc: 'Bitcoin', eth: 'Ethereum', base: 'Base', blrd: 'Bollard' };
function toAtoms(human, id) {
  const a = assets[id]; const s = String(human).trim();
  if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') throw new Error('Enter an amount.');
  const [i, f = ''] = s.split('.');
  if (f.length > a.decimals) throw new Error(`At most ${a.decimals} decimals for ${a.symbol}.`);
  return BigInt(i || '0') * 10n ** BigInt(a.decimals) + BigInt((f + '0'.repeat(a.decimals)).slice(0, a.decimals) || '0');
}
function human(atoms, id, digits) {
  const a = assets[id]; if (!a) return String(atoms);
  const s = BigInt(atoms).toString().padStart(a.decimals + 1, '0');
  let t = s.slice(0, -a.decimals) + '.' + s.slice(-a.decimals);
  if (digits !== undefined) t = Number(t).toFixed(digits); else t = t.replace(/\.?0+$/, '');
  return t;
}
const money = (atoms, id) => (id === 'eth:USDC' || id === 'eth:USDT' || id === 'base:USDC') ? `${SYMBOL[id]}${Number(human(atoms, id, 2)).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : `${human(atoms, id)} ${assets[id]?.symbol || id}`;
const LOGOS = {
  'eth:USDC': `<svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="16" fill="#2775CA"/><path fill="#fff" d="M20.5 18.6c0-2.3-1.4-3.1-4.2-3.5-2-.3-2.4-.8-2.4-1.7s.7-1.5 2-1.5c1.2 0 1.9.4 2.2 1.4.1.2.3.3.5.3h1.1c.3 0 .5-.2.4-.5-.3-1.5-1.4-2.6-3-2.9V8.8c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1.4c-2 .3-3.3 1.6-3.3 3.3 0 2.2 1.3 3 4.1 3.4 1.9.3 2.5.7 2.5 1.8s-.9 1.7-2.2 1.7c-1.6 0-2.2-.7-2.4-1.6-.1-.2-.3-.4-.5-.4h-1.2c-.3 0-.5.2-.4.5.3 1.7 1.4 2.9 3.4 3.2v1.4c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1.4c2-.3 3.4-1.7 3.4-3.5z"/><path fill="#fff" d="M12.6 25.6c-5.2-1.9-7.9-7.7-6-12.9 1-2.8 3.2-4.9 6-5.9.3-.1.4-.3.4-.6v-.9c0-.3-.1-.5-.4-.5h-.2C6 6.8 2.5 13.6 4.5 19.9c1.2 3.7 4.1 6.6 7.8 7.8.3.1.5 0 .6-.3v-1.2c0-.2-.1-.4-.3-.6zm7-19.9c-.3-.1-.5 0-.6.3v1.1c0 .2.1.4.3.6 5.2 1.9 7.9 7.7 6 12.9-1 2.8-3.2 4.9-6 5.9-.3.1-.4.3-.4.6v.9c0 .3.1.5.4.5h.2c6.4-2 9.9-8.8 7.9-15.1-1.2-3.8-4.1-6.7-7.8-7.7z"/></svg>`,
  'btc:BTC': `<svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="16" fill="#F7931A"/><text x="16" y="22" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Arial, Helvetica, sans-serif" transform="rotate(-12 16 16)">₿</text></svg>`,
  'eth:ETH': `<svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="16" fill="#627EEA"/><path fill="#fff" fill-opacity=".6" d="M16 5v8.1l6.9 3.1z"/><path fill="#fff" d="M16 5l-6.9 11.2 6.9-3.1z"/><path fill="#fff" fill-opacity=".6" d="M16 21.7V27l6.9-9.6z"/><path fill="#fff" d="M16 27v-5.3l-6.9-4.3z"/><path fill="#fff" fill-opacity=".2" d="M16 20.4l6.9-4.2-6.9-3.1z"/><path fill="#fff" fill-opacity=".6" d="M9.1 16.2l6.9 4.2v-7.3z"/></svg>`,
  'eth:USDT': `<svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="16" fill="#26A17B"/><path fill="#fff" d="M17.9 17.9v-.1c-.1 0-.7.1-1.9.1-1 0-1.7 0-1.9-.1v.1c-3.7-.2-6.5-.8-6.5-1.6s2.8-1.4 6.5-1.6v2.6c.3 0 1 .1 1.9.1 1.1 0 1.7-.1 1.9-.1v-2.6c3.7.2 6.5.8 6.5 1.6s-2.8 1.4-6.5 1.6zm0-3.5v-2.3h5.2V8.6H8.9v3.5h5.2v2.3c-4.2.2-7.4 1-7.4 2s3.2 1.8 7.4 2v7.5h3.8v-7.5c4.2-.2 7.4-1 7.4-2s-3.2-1.8-7.4-2z"/></svg>`,
  'BLRD': `<svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="16" fill="#1F5FBF"/><text x="16" y="22" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Arial, Helvetica, sans-serif">B</text></svg>`,
};
LOGOS['base:USDC'] = LOGOS['eth:USDC'];
LOGOS['base:gtUSDCp'] = `<svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="16" fill="#2775CA"/><circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="44 20" transform="rotate(-60 16 16)"/><text x="16" y="20.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Arial, Helvetica, sans-serif">%</text></svg>`;
const coinIcon = (id) => LOGOS[id] || '';
const short = (h, n = 10) => (h ? h.slice(0, n) + '…' : '');

// ----- state -----
const state = { flight: stored('bollard.flight'), qr: null, key: stored('bollard.passkey'), view: 'home', info: null, busy: false, error: '', activity: null, deposit: null, success: null, book: null };
const me = () => state.key?.pubkey;
const signer = () => signers.passkey(state.key);
const currency = () => state.info?.preferred || 'eth:USDC';
const main = document.querySelector('main');
const modal = document.getElementById('modal');
const tradeBox = document.getElementById('trade');
let tradeFrame = null;
// The trade page lives in one frame for the whole session: loaded once, faded in when ready, never rebuilt.
function ensureTradeFrame() {
  if (tradeFrame) return tradeFrame;
  tradeFrame = document.createElement('iframe'); tradeFrame.className = 'trade'; tradeFrame.title = 'Trade'; tradeFrame.src = '/dashboard/';
  tradeFrame.addEventListener('load', () => tradeFrame.classList.add('ready'));
  tradeBox.appendChild(tradeFrame);
  return tradeFrame;
}
let shownSuccess = null;
// Drawn once per success, so the check animates once; closed by a tap anywhere or the button.
function showSuccess(text) {
  shownSuccess = text;
  modal.innerHTML = `<div class="overlay" data-action="dismissSuccess"><div class="success"><svg viewBox="0 0 120 120" width="110" height="110"><circle class="ring" cx="60" cy="60" r="56"/><path class="tick" d="M34 62 L53 80 L88 42"/></svg><p>${esc(text)}</p><button class="primary" data-action="dismissSuccess">Done</button></div></div>`;
  modal.hidden = false;
}
modal.addEventListener('click', (e) => { if (e.target.closest('[data-action=dismissSuccess]')) { modal.hidden = true; modal.innerHTML = ''; state.success = null; shownSuccess = null; } });
const nav = document.querySelector('nav');

async function refresh() {
  if (!state.key) return render();
  state.info = await j(`/balances/${me()}`);
  try { state.prices = (await j('/oracle')).prices; } catch {}
  await checkFlight();
  render();
}
// A link that is out: once whoever opened it has accepted, the throwaway account is empty and the send is done.
async function checkFlight() {
  const f = state.flight; if (!f) return;
  try {
    const b = await j(`/balances/${hex.enc(pubkeyOf(f.secret))}`);
    const left = (b.assets || []).some((x) => x.amount > 0) || b.blrd > 0;
    if (!left) endFlight(`Sent ${f.amount}`);
  } catch {}
}
function endFlight(success) { state.flight = null; localStorage.removeItem('bollard.flight'); if (state.qr) state.qr = null; if (success) state.success = success; }
async function shareLink(link) {
  if (navigator.share) { try { await navigator.share({ url: link }); return; } catch {} }
  try { await navigator.clipboard.writeText(link); state.success = 'Link copied'; } catch {}
}
async function run(fn) {
  state.busy = true; state.error = ''; render();
  try { await fn(); } catch (e) { state.error = e.message || String(e); }
  state.busy = false; render();
}
async function tx(type, body) { return submit(api, signer(), type, body); }

// ----- actions -----
const actions = {
  create: () => run(async () => {
    const key = await createPasskey('Bollard');
    await j('/keys', { cred_id: key.id, pubkey: key.pubkey });
    store('bollard.passkey', key); state.key = key;
    await refresh();
  }),
  signin: () => run(async () => {
    const id = await signInPasskey(stored('bollard.passkey')?.id);
    const key = stored('bollard.passkey')?.id === id ? stored('bollard.passkey') : { id, pubkey: (await j(`/keys/${id}`)).pubkey };
    store('bollard.passkey', key); state.key = key;
    await refresh();
  }),
  signout: () => { localStorage.removeItem('bollard.passkey'); state.key = null; state.info = null; render(); },
  menu: () => { state.menu = !state.menu; render(); },

// Dollars per bitcoin from the book: the middle of the best bid and ask, else the last trade. Quote atoms per 10^8 sats.
async function btcPrice() {
  try {
    const b = await j('/book?market=btc:BTC/eth:USDC');
    const ask = b.asks?.length ? Math.min(...b.asks.map((o) => Number(o.price))) : null;
    const bid = b.bids?.length ? Math.max(...b.bids.map((o) => Number(o.price))) : null;
    if (ask && bid) return (ask + bid) / 2; if (ask || bid) return ask || bid;
    const t = await j('/trades?market=btc:BTC/eth:USDC&limit=1'); if (t?.length) return Number(t[0].price);
  } catch {}

}

// Start a panel slide after a render: the track is drawn at its old position, then moved.
// A damped spring, the same numbers react-spring uses by default. Drives one value from where it is to a target.
function springTo(el, prop, to, unit, opts = {}) {
  const { stiffness = 170, damping = 26, mass = 1 } = opts;

  if (opts.from !== undefined) st.x = opts.from;
  cancelAnimationFrame(st.raf);

  if (document.hidden) { st.x = to; st.v = 0; el.style[prop] = `translateX(${to}${unit})`; if (opts.onRest) opts.onRest(); return; }

    const dt = Math.min(0.064, (now - last) / 1000); last = now;
    const a = (-stiffness * (st.x - to) - damping * st.v) / mass;
    st.v += a * dt; st.x += st.v * dt;
    const done = Math.abs(st.v) < 0.01 && Math.abs(st.x - to) < 0.01;

    el.style[prop] = `translateX(${st.x}${unit})`;
    if (!done) st.raf = requestAnimationFrame(step); else if (opts.onRest) opts.onRest();

async function quoteSell() {

  const run = (sl.run = (sl.run || 0) + 1);
  const a = assets[sl.asset]; const raw = (sl.typed || '').trim();
  if (!raw || Number(raw) === 0) { sl.quote = null; render(); return; }

  try { bids = ((await j(`/book?market=${encodeURIComponent(sl.asset + '/eth:USDC')}`)).bids || []).sort((x, y) => y.price - x.price); } catch {}
  if (run !== sl.run) return;
  if (!bids.length) { sl.quote = { text: `Nobody is buying ${a.symbol} right now.`, fills: [] }; render(); return; }
  let qty = 0n;
  try {
    if (sl.unit === 'usd') { let budget = toAtoms(raw, 'eth:USDC'); for (const o of bids) { if (budget <= 0n) break; const can = (budget * 100000000n) / BigInt(o.price); const take = can < BigInt(o.qty_left) ? can : BigInt(o.qty_left); qty += take; budget -= (take * BigInt(o.price)) / 100000000n; } }

  render();
}

      <div class="stack">
        <p class="muted center"><span class="spinner"></span>${state.busy ? 'Cancelling' : 'Sending'} ${esc(f.amount)}</p>
        <div class="row fill"><button data-action="cancelFlight" ${busy}>Cancel</button><button data-action="qr" data-link="${esc(f.link)}">QR code</button><button class="primary" data-action="share" data-link="${esc(f.link)}">${navigator.share ? 'Share link' : 'Copy link'}</button></div>
      </div>` : `
      <form data-form="send" class="stack">
        ${empty ? `
        <div class="row fill">
          <div class="field" style="flex:1"><span class="label">Network</span><select name="chain" data-change="fromChain">${chains.map((ch) => `<option value="${ch}" ${ch === from.chain ? 'selected' : ''}>${CHAIN[ch] || ch}</option>`).join('')}</select></div>
          <div class="field" style="flex:1"><span class="label">Token</span><select name="asset" data-change="fromAsset">${tokens.map((h) => `<option value="${h.asset}" ${h.asset === from.asset ? 'selected' : ''}>${assets[h.asset]?.symbol || h.asset} · ${money(h.amount, h.asset)}</option>`).join('')}</select></div>
        </div>` : ''}
        <input class="amount" name="amount" placeholder="${empty ? '0 ' + (assets[from.asset]?.symbol || '') : '0.00'}" inputmode="decimal" autocomplete="off" required>
        <div class="row end">
          <button name="via" value="qr" ${busy}>${state.busy && state.via === 'qr' ? 'Signing…' : 'Generate QR code'}</button>
          <button class="primary" name="via" value="share" ${busy}>${state.busy && state.via === 'share' ? 'Signing…' : 'Send'}</button>
        </div>
      </form>`;
    return `
      <div class="stack center" style="gap:10px">
        <span class="curpill">${coinIcon(c)}${esc(assets[c]?.symbol || c)} on ${esc(CHAIN[assets[c]?.chain] || '')}${c === VAULT.asset && state.vault ? ` · earning ${(100 * (state.vault.netApy ?? state.vault.apy)).toFixed(2)}%` : ''}</span>
        <h1>${money(balanceOf(c), c)}</h1>
      </div>
      ${body}
      ${others.length ? `<ul class="assets">${others.map((h) => `<li><span class="withicon">${coinIcon(h.asset)}${NAMES[h.asset] || h.asset}</span><span>${money(h.amount, h.asset)}</span></li>`).join('')}</ul>` : ''}`;
  },
  portfolio: () => {
    // Advanced mode is the full trade view: chart, book and taking. Simple mode is what you hold.
    if (advanced() || state.buying) return state.buying && !advanced() ? '<p class="center"><button class="link" data-action="buyDone">← Back to portfolio</button></p>' : '';
    const held = holdings();
    if (held.some((h) => h.asset === VAULT.asset) && !state.vault) loadVault();
    const prices = state.prices || {};
    const value = (h) => { const p = prices[h.asset]; return p ? (h.amount * BigInt(p)) / 100000000n : null; };
    const total = held.reduce((n, h) => n + (value(h) || 0n), 0n);
    const canPay = balanceOf('eth:USDC') > 0n;
    const buy = `<div class="stack center">
      <button class="primary" data-action="buy" ${canPay ? '' : 'disabled'} style="width:min(300px,100%)">Buy an asset</button>
      ${canPay ? '' : '<p class="muted center">Nothing to pay with yet. <a href="#deposit" class="golink" data-action="tab" data-value="deposit">Deposit</a> first.</p>'}</div>`;
    if (!held.length) return `<h2>Portfolio</h2><p class="muted center">You don't have any assets yet.</p>${buy}`;
    const sell = state.sell;
    const list = `
      <div class="stack center"><h1>${money(total, 'eth:USDC')}</h1></div>
      <ul class="assets">${held.map((h) => `<li><button type="button" class="rowbtn" data-action="sellPick" data-value="${h.asset}"><span class="withicon">${coinIcon(h.asset)}<span>${NAMES[h.asset] || h.asset}<span class="sub">${money(h.amount, h.asset)}${h.asset === VAULT.asset && state.vault ? ` · earning ${(100 * (state.vault.netApy ?? state.vault.apy)).toFixed(2)}%` : ''}</span></span></span><span class="right">${value(h) !== null ? money(value(h), 'eth:USDC') : '<span class="muted">no price yet</span>'}${h.asset === 'eth:USDC' ? '' : '<span class="chev">›</span>'}</span></button></li>`).join('')}</ul>
      ${buy}`;
    const pane2 = sell ? sellPane(sell) : '';
    return `
      <h2>Portfolio</h2>
      <div class="slider"><div class="track" data-pos="${sell ? '-50' : '0'}">
        <div class="pane">${list}</div>
        <div class="pane">${pane2}</div>
      </div></div>`;
  },
  deposit: () => {
    const d = state.deposit || (state.deposit = { asset: 'eth:USDC', unit: 'native', step: 'pick' });
    const a = assets[d.asset]; const chain = CHAIN[a?.chain] || '';
    if (d.pays) {
      return `
        <h2>Deposit ${a?.symbol}</h2>
        <div class="stack">
          ${(d.pays || []).map((m) => `<div class="stack center" style="padding:12px 0;border-top:1px solid var(--line)">
            <p>Pay <b>${money(m.taker_amount, m.taker_asset)}</b> on ${chain} to</p>
            <div class="qr">${qrSvg(a.chain === 'btc' ? `bitcoin:${m.taker_pay_to}?amount=${human(m.taker_amount, m.taker_asset)}` : m.taker_pay_to)}</div>
            <p class="mono">${m.taker_pay_to}</p>
            <div class="row center"><button data-action="copy" data-text="${m.taker_pay_to}" data-label="Copy address">Copy address</button>${(a.chain === 'eth' || a.chain === 'base') && hasEthWallet() && m.status === 'open' ? `<button class="primary" data-action="payMetaMask" data-to="${m.taker_pay_to}" data-amount="${m.taker_amount}">Pay with MetaMask</button>` : ''}</div>
            ${d.sent?.[m.taker_pay_to] ? `<p class="muted center">Sent ${short(d.sent[m.taker_pay_to], 14)} from your wallet.</p>` : ''}
            <p class="muted center">${m.status === 'closed' ? 'Paid; the balance is yours.' : m.status !== 'open' ? `This claim ${m.status}; the seller got their balance back.` : m.taker_txid ? `Payment ${short(m.taker_txid, 12)} seen; waiting for a block.` : 'A maker sells you this for the coin itself; pay them and it is yours once the payment is in a block. Watching the chain.'}</p>
          </div>`).join('')}
          ${d.short ? `<p class="muted center">Only ${money(toAtoms(human(d.short, d.asset), d.asset) === 0n ? 0 : d.short, d.asset)} less than you asked for was on offer; the rest can be bought later.</p>` : ''}
          <button class="link" data-action="depositDone">Done</button>
        </div>`;
    }
    // Two panels that slide: pick the coin, then type the amount.
    const rows = [['eth:USDC', 'USD Coin', 'on Ethereum · pay with MetaMask or any wallet'], ['base:USDC', 'USD Coin', 'on Base · cheaper, same dollars'], ['btc:BTC', 'Bitcoin', 'on Bitcoin · one confirmation']];
    const chosen = rows.find((r) => r[0] === d.asset) || rows[0];
    const step2 = d.step === 'amount';
    return `
      <h2>Deposit</h2>
      <div class="slider"><div class="track ${step2 ? 'two' : ''}" data-anim="${d.anim || ''}">
        <div class="pane">
          ${rows.map(([id, name, sub]) => `<button type="button" class="optrow" data-action="depositPick" data-value="${id}">${coinIcon(id)}<span class="txt"><b>${name}</b><span class="sub">${sub}</span></span><span class="chev">›</span></button>`).join('')}
        </div>
        <div class="pane">
          <button type="button" class="link back" data-action="depositBack">‹ ${chosen[1]}</button>
          <form data-form="deposit" class="stack">
            ${d.asset === 'btc:BTC' ? `
            <div class="big-amount">
              <span class="grow"></span>
              <span class="entry"><span class="prefix ${d.unit === 'usd' ? '' : 'hidden'}">$</span><input name="amount_${d.unit}" inputmode="decimal" placeholder="0" autocomplete="off" required data-input="depositAmount" style="width:1ch"><span class="suffix ${d.unit === 'btc' ? '' : 'hidden'}">BTC</span></span>
              <span class="grow"><button type="button" class="swap-unit" data-action="depositUnit" data-value="${d.unit === 'usd' ? 'btc' : 'usd'}" aria-label="Switch between dollars and bitcoin">⇅</button></span>
            </div>
            <p class="muted center" id="dep-equiv">${d.unit === 'usd' ? '0 BTC' : '$0'}</p>` : `
            <div class="big-amount"><span class="grow"></span><span class="entry"><span class="prefix">$</span><input name="amount" inputmode="decimal" placeholder="0" autocomplete="off" required data-input="depositAmount" style="width:1ch"></span><span class="grow"></span></div>
            <p class="muted center">USDC on ${CHAIN[assets[d.asset]?.chain] || ''}</p>`}
            <button class="primary" type="submit" ${state.busy ? 'disabled' : ''}>Deposit</button>
          </form>
        </div>
      </div></div>`;
  },
  withdraw: () => {
    const held = (state.info?.assets || []).filter((x) => x.amount > 0);
    return `
      <h2>Withdraw</h2>
      ${held.length ? `
      <form data-form="withdraw" class="stack">
        <div class="field"><span class="label">Currency</span><select name="asset" data-change="asset">${held.map((x) => `<option value="${x.asset}">${NAMES[x.asset] || x.asset} · ${money(x.amount, x.asset)}</option>`).join('')}</select></div>
        <div class="field"><input class="amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required></div>
        <div class="field"><span class="label">Deliver to (your address on that chain)</span><input name="to" class="mono" autocomplete="off" spellcheck="false" required></div>
        <div class="field"><span class="label">Delivered by</span><select name="issuer" data-change="noop"><option value="">Whichever maker the ledger picks</option>${(state.issuers || []).map((i) => `<option value="${i.account}">${short(i.account, 10)} · ${i.ratio_bps >= 0 ? (i.ratio_bps / 100).toFixed(0) + '% collateral' : ''} · from ${short(i.source, 12)}</option>`).join('')}</select></div>
        <p class="muted">The maker delivers the real coins to your address from the address it declared when it issued. Their BLRD stake pays you if they don't. If you see a maker's coins move, you can call that maker here.</p>
        <button class="primary" type="submit" ${state.busy ? 'disabled' : ''}>Withdraw</button>
      </form>` : '<p class="muted center">Nothing to withdraw yet.</p>'}`;
  },
  activity: () => {
    const act = state.activity; if (!act) return '<h2>History</h2><p class="muted center"><span class="spinner"></span>Loading…</p>';
    const rows = [];
    for (const t of act.transfers) {
      const out = t.sender === me();
      rows.push({ seq: t.seq, ts: t.ts, label: out ? 'Sent' : 'Received', value: out ? `−${money(t.amount, t.asset)}` : `+${money(t.delivered, t.delivered_asset)}`, sub: out && t.delivered_asset !== t.asset ? `arrived as ${money(t.delivered, t.delivered_asset)}` : short(out ? t.receiver : t.sender, 12) });
    }
    const sendSeqs = new Set(act.transfers.map((t) => t.seq));
    for (const m of act.matches) {
      if (m.kind === 'trade' && sendSeqs.has(m.seq)) continue; // the conversion inside a send is shown on the send itself
      if (m.kind === 'deposit' && m.taker === me()) rows.push({ seq: m.seq, ts: m.claimed_ts, label: 'Deposit', value: `+${money(m.maker_amount, m.maker_asset)}`, sub: m.status === 'closed' ? 'done' : m.status === 'open' ? (m.taker_txid ? 'payment seen, waiting for a block' : 'waiting for your payment') : m.status });
      else if (m.kind === 'exercise' && m.taker === me()) rows.push({ seq: m.seq, ts: m.claimed_ts, label: 'Withdrawal', value: `−${money(m.maker_amount, m.maker_asset)}`, sub: m.status === 'closed' ? 'delivered' : m.status === 'open' ? (m.maker_txid ? 'delivery sent, waiting for a block' : 'waiting for the maker to deliver') : m.status === 'missed' ? 'maker failed; their stake was paid to you in BLRD' : m.status });
      else if (m.kind === 'trade' && m.taker === me()) rows.push({ seq: m.seq, ts: m.claimed_ts, label: 'Swap', value: `${money(m.taker_amount, m.taker_asset)} → ${money(m.maker_amount, m.maker_asset)}`, sub: 'instant' });
    }
    rows.sort((a, b) => b.seq - a.seq);
    return `<h2>History</h2>${rows.length ? `<ul>${rows.map((r) => `<li><span>${r.label}<span class="sub">${esc(r.sub)} · ${new Date(r.ts).toLocaleString()}</span></span><span>${r.value}</span></li>`).join('')}</ul>` : '<p class="muted center">Nothing yet.</p>'}`;
  },
  settings: () => `
    <h2>Settings</h2>
    <div class="stack">
      <span class="label">Your currency</span>
      <div class="row">${Object.values(assets).map((x) => `<button class="pill ${x.id === currency() ? 'primary' : ''}" data-action="currency" data-value="${x.id}">${NAMES[x.id] || x.id}</button>`).join('')}</div>
      <p class="muted">What you see your balance in and what you receive. Anything sent to you in another currency is converted on the way.</p>
      <span class="label">Advanced mode</span>
      <div class="row"><button class="pill ${advanced() ? 'primary' : ''}" data-action="advanced" data-value="1">On</button><button class="pill ${advanced() ? '' : 'primary'}" data-action="advanced" data-value="0">Off</button></div>
      <p class="muted">Portfolio shows the chart, the order book and taking, instead of a plain list of what you hold.</p>
      <span class="label">Account</span>
      <p class="mono">${me()}</p>
      <p class="muted">Signed in with a passkey. The same passkey signs you in on your other devices.</p>
      <button data-action="signout">Sign out</button>
    </div>`,
};

// ----- wiring -----
main.addEventListener('click', (e) => { const el = e.target.closest('[data-action]'); const fn = el && actions[el.dataset.action]; if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el); } });
nav.addEventListener('click', (e) => { const el = e.target.closest('[data-action]'); const fn = el && actions[el.dataset.action]; if (fn) fn(el); });
main.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (!el) return; if (el.dataset.change === 'noop') return; if (el.name === 'asset' && state.view === 'withdraw') { loadIssuers(el.value); return; } if (el.dataset.change === 'fromChain') state.from = { chain: el.value }; if (el.dataset.change === 'fromAsset') state.from = { chain: sendFrom().chain, asset: el.value }; render(); });
main.addEventListener('input', (e) => {
  const sEl = e.target.closest('[data-input=sellAmount]');
  if (sEl && state.sell) { sEl.style.width = Math.max(1, sEl.value.length) + 'ch'; state.sell.typed = sEl.value; clearTimeout(state.sell.timer); state.sell.timer = setTimeout(quoteSell, 250); return; }
  const el = e.target.closest('[data-input=depositAmount]'); if (!el) return;
  el.style.width = Math.max(1, el.value.length) + 'ch';
  const out = document.getElementById('dep-equiv'); if (!out || state.deposit?.asset !== 'btc:BTC') return;
  const p = state.btcPrice;
  try {
    if (state.deposit.unit === 'usd') { const usd = toAtoms(el.value || '0', 'eth:USDC'); out.textContent = p ? `${human((usd * 100000000n) / BigInt(Math.round(p)), 'btc:BTC')} BTC` : 'no bitcoin price on the book yet'; }
    else { const sats = toAtoms(el.value || '0', 'btc:BTC'); out.textContent = p ? `$${human((sats * BigInt(Math.round(p))) / 100000000n, 'eth:USDC', 2)}` : 'no bitcoin price on the book yet'; }
  } catch { out.textContent = ''; }
});
main.addEventListener('submit', (e) => { e.preventDefault(); const fn = forms[e.target.dataset.form]; if (fn) fn(e.target, e.submitter?.value); });

(async () => {
  if (api) { try { const r = await fetch(api + '/status', { signal: AbortSignal.timeout(4000) }); if (!r.ok) api = ''; } catch { api = ''; } }
  const m = await j('/markets'); for (const a of m.assets) assets[a.id] = a;
  const magic = location.hash.match(/^#magic\/([0-9a-f]{64})$/);
  if (magic) {
    state.accept = { secret: magic[1] };
    render();
    try {
      const b = await j(`/balances/${hex.enc(pubkeyOf(magic[1]))}`);
      state.accept.assets = [...(b.assets || []), ...(b.blrd > 0 ? [{ asset: 'BLRD', amount: b.blrd }] : [])];
    } catch (e) { state.accept.error = e.message; }
  }
  render();
  try { await refresh(); } catch (e) { state.error = e.message; render(); }
  if (hasEthWallet()) { connectEthWallet(false).catch(() => {}); try { window.ethereum.on?.('accountsChanged', (a) => { state.ethAccount = a?.[0] || null; render(); }); } catch {} }
  if (state.key) setTimeout(ensureTradeFrame, 1500);
  const es = new EventSource(api + '/events');
  es.onmessage = () => { if (state.key) refresh().catch(() => {}); };
  setInterval(() => { if (state.key) refresh().catch(() => {}); }, 20000);
})();
</script>
</body>
</html>
