[package]
name = "bollard"
version = "0.1.0"
edition = "2021"
description = "Bollard: a cross-chain order-book exchange finalized on Bitcoin"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http2"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = { version = "0.32", features = ["rand-std", "serde", "base64"] }
sha2 = "0.10"
hex = "0.4"
sha3 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
flatbuffers = "25.12.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
