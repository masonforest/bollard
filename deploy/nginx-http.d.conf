# /etc/nginx/http.d/sites.conf on the Vultr host (Alpine nginx).
# Three names, one nginx. bitcoin.dance and sepolia are bun servers on local
# ports; bollard.exchange is the bollard node, which is also the default
# server so other nodes can reach it by bare IP on port 80.
# TLS: certbot --nginx manages the certificates and 443 blocks.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# SSE and long polls need buffering off and long timeouts.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;

server {
    listen 80;
    listen [::]:80;
    server_name bitcoin.dance www.bitcoin.dance;
    location / { proxy_pass http://127.0.0.1:3000; }
}

server {
    listen 80;
    listen [::]:80;
    server_name sepolia.bitcoin.dance;
    location / { proxy_pass http://127.0.0.1:3100; }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bollard.exchange www.bollard.exchange _;
    location / { proxy_pass http://127.0.0.1:8080; }
}
